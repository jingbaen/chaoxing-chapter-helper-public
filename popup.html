<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习通章节助手</title><link rel="stylesheet" href="popup.css"></head>
<body><header><span class="mark">▷</span><div><strong>学习通章节助手</strong><small>章节视频与文档 · 1.0.6</small></div></header>
<p id="status" role="status" aria-live="polite">正在连接当前标签页…</p><div id="count"></div>
<label class="speed">播放速度<select id="rate"><option value="1">1 倍</option><option value="1.25">1.25 倍</option><option value="1.5">1.5 倍</option><option value="2" selected>2 倍</option></select></label>
<label><input id="documents" type="checkbox" checked>文档自动滚到底</label><label><input id="guard" type="checkbox" checked>鼠标离开后继续播放</label>
<label><input id="autoNext" type="checkbox" checked>确认完成后自动下一节</label><label><input id="muted" type="checkbox" checked>静音播放（便于自动开始）</label>
<div class="buttons"><button id="start">开始</button><button id="pause">暂停</button></div><button class="export" id="export">导出脱敏诊断记录</button>
<footer>首次加载扩展后，请刷新学习通页面。<br>进入具体子单元再开始，视频与 PPT 会依次处理。</footer><script src="diagnostics.js"></script><script src="popup.js"></script></body></html>
